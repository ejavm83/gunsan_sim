# WebSocket/ForwardMsg 관련 오류 완화(클라이언트 캐시). Community Cloud에서도 무해하다.
[browser]
gatherUsageStats = false

# 대시보드 시각 통일: 슬라이더·주요 버튼에 쓰이는 primary 색을 청록 계열로 맞춥니다.
[theme]
primaryColor = "#22d3ee"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[client]
toolbarMode = "minimal"
